# Alibaba Cloud Function Compute (FC) Deployment Template
# 
# 前置要求：
# 1. 安装 Serverless Devs: npm install @serverless-devs/s -g
# 2. 配置阿里云账号: s config add --AccessKeyID xxx --AccessKeySecret xxx --AccountID xxx --alias default
#
# 部署命令: s deploy
# 查看日志: s logs
# 本地调试: s local start

edition: 3.0.0
name: model-detective
access: default

vars:
  region: cn-hangzhou  # 可修改为 cn-beijing, cn-shenzhen, cn-shanghai 等
  service:
    name: model-detective-service
    description: Model Detective - API中转站检测与模型能力测评

resources:
  model_detective:
    component: fc3
    props:
      region: ${vars.region}
      service: ${vars.service}
      functionName: model-detective
      description: Model Detective Flask应用
      runtime: python3.10
      code: ./
      handler: aliyun_fc_app.handler
      # 内存和超时配置 - 支持 Full Test
      memorySize: 1024  # 1GB 内存，提升并发处理能力
      timeout: 300      # 5分钟超时，支持 Full Test（约2-5分钟）
      environmentVariables:
        FLASK_ENV: production
        PYTHONPATH: /opt/python
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous  # 公开访问，无需认证
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      # 自定义域名配置（可选，部署后手动在控制台配置）
      # customDomains:
      #   - domainName: auto
      #     protocol: HTTP
