# Render.com Blueprint Configuration
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: model-detective-v5
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_web:app --workers 1 --threads 4 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
